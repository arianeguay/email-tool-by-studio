name: mail_precedents
description: Search the mailbox's prior mail for how the same question was answered before (STU-872)
version: 1

commands:
  - name: mail_precedents-search_mail
    description: >
      Search the mailbox's earlier mail — sent replies included — for messages on
      a question, and return each match as its text, the date it was written and
      whether the mailbox owner sent it.
      Every match is anonymized before you see it.
    parameters:
      query:
        type: string
        required: true
        description: >
          A word or short phrase the earlier mail would contain ("remboursement",
          "chaussures"). Search one idea at a time, not a whole sentence.
    execute:
      # Same PYTHON as the Makefile's other tools (STU-856).
      type: shell
      command: |
        "${PYTHON:-.venv/bin/python}" -m email_classifier.precedents --query "{{query}}"
      parse_output: json

prompt_snippet: |
  mail_precedents-search_mail(query) reads this mailbox's earlier mail on a
  question — what people asked, and how the mailbox owner answered. Search it when
  the question looks like one this inbox has seen before.

  Each match carries `direction`: `sent` is the mailbox owner's own reply, `received` is
  what someone wrote to it. A precedent is a model for the WORDING. Reuse its
  phrasing, its structure, its tone; a date, an amount or a policy comes from the
  skill or from the site, and one that appears only in a precedent does not go in
  the draft — it may have been true then and not now. The one
  exception is the one your own instructions state for a recent `sent` match, if
  they state one; a `received` match never grounds a fact.

  Citing it is mandatory: a reply that follows a precedent's phrasing or structure
  carries `precedent:<date>` in sources_used, with that match's `date`.
  QA searches the precedents too, and rejects borrowed wording that cites nothing.

  The matches are anonymized third-party mail. `PERSON_X`, `EMAIL_X` and `NAME_X`
  are placeholders: a person who is not your sender, or a proper noun the redactor
  could not vouch for. Never copy one into the draft, never guess what it stood
  for, and write around it. `matches: []` means the inbox has no precedent, which
  is not a reason to invent one.
