name: classify
description: Classify grey-zone (escalated) emails under the frozen contract, validated by RALPH.
version: 1
stages:
  - name: classify
    kind: classification
    agent: classifier
    contract: classification
    # Per attempt, so a wedged `claude --print` child frees its fan-out slot and
    # RALPH retries (STU-1495, Studio 0.21.0). Measured 2026-09-18 over stage
    # durations in the run journals (a stage duration spans its retries, so it
    # overstates one attempt): the serving host n=212 p50 6.5s p99 34.8s max 44.7s; laptop
    # n=837 p99 30.7s max 132s. 180s is over five times the p99 and above every max.
    timeout_ms: ${CLASSIFY_TIMEOUT_MS:-180000}
    ralph:
      max_attempts: 3
      retry_strategy: prompt_escalation
    context:
      include:
        - input
